services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    restart: always
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./lib:/var/lib
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ROUTES=${TS_ROUTES}
    network_mode: host
    privileged: true
